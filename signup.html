<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Get in touch</title>
<style>
  :root{
    --accent:#2A6EF4;
    --ink:#1a1a18;
    --ink2:#5a5a54;
    --ink3:#9a9a90;
    --line:#eceae4;
    --bg:#f1efe8;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px;}

  .head{text-align:center;padding:10px 4px 22px;}
  .eyebrow{
    font-size:11px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--accent);font-weight:700;margin-bottom:10px;
  }
  .eyebrow:empty{display:none;}
  h1{font-size:30px;line-height:1.18;margin:0;font-weight:600;letter-spacing:-.5px;}
  .sub{font-size:15px;color:var(--ink2);line-height:1.6;margin:12px 0 0;}
  .sub:empty{display:none;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  .req{color:var(--accent);}
  input,textarea{
    width:100%;font-size:16px;font-family:inherit;color:var(--ink);
    padding:12px 13px;border:1px solid #ddd9d0;border-radius:9px;background:#fff;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:92px;resize:vertical;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;min-width:0;}
  .row2>div>label{margin-top:0;}

  .btn{
    width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .btn:disabled{opacity:.6;cursor:default;}
  .err{color:#B3261E;font-size:13px;margin-top:10px;display:none;}
  .fine{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:12px;}

  .pitch{
    font-size:14px;color:var(--ink2);line-height:1.65;
    margin-top:18px;padding:16px 18px;background:#fff;
    border:1px solid var(--line);border-radius:12px;
  }
  .pitch:empty{display:none;}

  .agent{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:24px;}
  .agent img{width:46px;height:46px;border-radius:50%;object-fit:cover;display:none;}
  .nm{font-size:14px;font-weight:600;}
  .br{font-size:12px;color:var(--ink3);}
  .ftr{text-align:center;font-size:12px;color:var(--ink3);margin-top:8px;}

  .thanks{display:none;text-align:center;padding:40px 20px;}
  .thanks .tick{
    width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:26px;line-height:54px;margin:0 auto 16px;
  }
  .thanks h2{font-size:22px;margin:0 0 8px;font-weight:600;}
  .thanks p{font-size:15px;color:var(--ink2);line-height:1.6;margin:0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline">Get in touch</h1>
    <p class="sub" id="subhead"></p>
  </div>

  <div class="card" id="form-view">
    <div class="row2" id="row-name">
      <div id="wrap-first"><label for="f-first">First name <span class="req" id="rq-first"></span></label><input type="text" id="f-first" autocomplete="given-name"/></div>
      <div id="wrap-last"><label for="f-last">Last name <span class="req" id="rq-last"></span></label><input type="text" id="f-last" autocomplete="family-name"/></div>
    </div>

    <div id="wrap-email"><label for="f-email">Email <span class="req" id="rq-email"></span></label><input type="email" id="f-email" placeholder="you@email.com" autocomplete="email"/></div>
    <div id="wrap-phone"><label for="f-phone">Phone <span class="req" id="rq-phone"></span></label><input type="tel" id="f-phone" placeholder="(440) 555-0123" autocomplete="tel"/></div>
    <div id="wrap-address"><label for="f-address">Address <span class="req" id="rq-address"></span></label><input type="text" id="f-address" autocomplete="street-address"/></div>
    <div id="wrap-comments"><label for="f-comments">Message <span class="req" id="rq-comments"></span></label><textarea id="f-comments"></textarea></div>

    <div class="err" id="err"></div>
    <button class="btn" id="submit-btn" onclick="submitLead()">Send &rarr;</button>
    <div class="fine">&#128274; Private &amp; secure. Never sold or shared.</div>
  </div>

  <div class="thanks" id="thanks-view">
    <div class="tick">&#10003;</div>
    <h2>Thank you</h2>
    <p id="thanks-msg">Thanks &mdash; I&rsquo;ll be in touch shortly.</p>
  </div>

  <div class="pitch" id="pitch"></div>

  <div class="agent">
    <img id="agent-photo" alt=""/>
    <div>
      <div class="nm" id="agent-name"></div>
      <div class="br" id="agent-brokerage"></div>
    </div>
  </div>
  <div class="ftr" id="footer"></div>

</div>

<script>
  var WORKER_URL = 'https://app.tom-b52.workers.dev';
  var FB_PROJECT = 'buyers-880bc';
  var FB_KEY = 'AIzaSyCy5ZkbPcGtk7I_88dVbNsX40LY-M4R_sY';

  var params = new URLSearchParams(location.search);
  var AGENT = (params.get('a') || 'tom').toLowerCase().replace(/[^a-z0-9]/g,'');
  var TEMPLATE = (params.get('t') || 'signup').toLowerCase().replace(/[^a-z0-9]/g,'');
  var CFG = {};

  // Which fields appear, and which must be filled. Both come from the builder and are
  // independent: an address can be offered without being demanded.
  //
  // The defaults are what a bare contact form needs, so a page that has never been configured
  // still collects something usable rather than rendering an empty card.
  var SHOW = { first:1, last:1, email:1, phone:1, address:0, comments:1 };
  var NEED = { first:1, last:0, email:1, phone:0, address:0, comments:0 };

  var FIELD_LABEL = {
    first:'first name', last:'last name', email:'email',
    phone:'phone number', address:'address', comments:'message'
  };

  function fsVal(v){
    if(!v) return '';
    if(v.stringValue !== undefined) return v.stringValue;
    if(v.integerValue !== undefined) return v.integerValue;
    if(v.booleanValue !== undefined) return v.booleanValue;
    if(v.doubleValue !== undefined) return v.doubleValue;
    return '';
  }
  function setText(id, t){ var el = document.getElementById(id); if(el && t) el.textContent = t; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function _csv(s){
    return String(s||'').toLowerCase().split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  }

  function applyConfig(c){
    CFG = c || {};
    if(c.accent) document.documentElement.style.setProperty('--accent', c.accent);

    setText('eyebrow', c.eyebrow);
    setText('headline', c.headline);
    setText('subhead', c.subhead);
    if(c.headline) document.title = c.headline;
    if(c.ctaText) document.getElementById('submit-btn').innerHTML = esc(c.ctaText) + ' &rarr;';
    if(c.pitch) document.getElementById('pitch').innerHTML = c.pitch;
    if(c.thanksMsg) setText('thanks-msg', c.thanksMsg);

    setText('agent-name', c.agentName);
    setText('agent-brokerage', c.brokerage);
    if(c.agentPhoto){
      var ph = document.getElementById('agent-photo');
      ph.src = c.agentPhoto; ph.style.display = 'block';
    }
    if(c.footer) setText('footer', c.footer);

    // A stored list replaces the defaults entirely. Absent, the defaults stand.
    if(c.fields){
      var on = _csv(c.fields);
      Object.keys(SHOW).forEach(function(k){ SHOW[k] = on.indexOf(k) !== -1 ? 1 : 0; });
    }
    if(c.required){
      var rq = _csv(c.required);
      Object.keys(NEED).forEach(function(k){ NEED[k] = rq.indexOf(k) !== -1 ? 1 : 0; });
    }

    renderFields();
  }

  function renderFields(){
    Object.keys(SHOW).forEach(function(k){
      var w = document.getElementById('wrap-' + k);
      if(w) w.style.display = SHOW[k] ? '' : 'none';
      var r = document.getElementById('rq-' + k);
      // A field that is hidden cannot be required, whatever the config says.
      if(r) r.textContent = (SHOW[k] && NEED[k]) ? '*' : '';
    });
    // The name row holds two fields; hide the row only when both are off, or it leaves a gap.
    var row = document.getElementById('row-name');
    if(row) row.style.display = (SHOW.first || SHOW.last) ? 'flex' : 'none';
  }

  function load(){
    var docId = AGENT + '_' + TEMPLATE;
    fetch('https://firestore.googleapis.com/v1/projects/' + FB_PROJECT + '/databases/(default)/documents/landing_pages/' + docId + '?key=' + FB_KEY)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.fields){
          var c = {};
          Object.keys(d.fields).forEach(function(k){ c[k] = fsVal(d.fields[k]); });
          applyConfig(c);
        } else {
          renderFields();
        }
      })
      .catch(function(){ renderFields(); });
  }

  function showErr(msg){
    var e = document.getElementById('err');
    e.textContent = msg; e.style.display = 'block';
  }

  function submitLead(){
    document.getElementById('err').style.display = 'none';

    var val = {};
    Object.keys(SHOW).forEach(function(k){
      var el = document.getElementById('f-' + k);
      val[k] = (SHOW[k] && el) ? String(el.value || '').trim() : '';
    });

    // Only complain about a field that is both shown and required.
    var missing = Object.keys(NEED).filter(function(k){ return SHOW[k] && NEED[k] && !val[k]; });
    if(missing.length){
      showErr('Please enter your ' + FIELD_LABEL[missing[0]] + '.');
      var f = document.getElementById('f-' + missing[0]); if(f) f.focus();
      return;
    }

    // A lead with no way to reach them is not a lead. Guarded here as well as in the builder,
    // because a page configured before that check existed would otherwise collect dead ends.
    if(!val.email && !val.phone){
      showErr('Please leave an email address or a phone number so I can reply.');
      return;
    }

    var btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Sending\u2026';

    var payload = {
      firstName: val.first, lastName: val.last,
      email: val.email, phone: val.phone, address: val.address,
      agentId: AGENT,
      source: (CFG.source || 'Sign-Up Page'),
      notes: val.comments || '',
      leadStatus: (CFG.leadStatus || 'pipeline'),
      leadSegment: (CFG.leadSegment || ''),
      smartPlanId: (CFG.smartPlanId || ''),
      smartPlanName: (CFG.smartPlanName || '')
    };

    fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'X-Action':'inbound-lead' },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(){
        document.getElementById('form-view').style.display = 'none';
        document.getElementById('thanks-view').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Send \u2192';
        showErr('Something went wrong. Please try again.');
      });
  }

  load();
</script>
</body>
</html>
