<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Open House — Nest Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C9A84C;--gold-lt:rgba(201,168,76,0.08);--gold-md:rgba(201,168,76,0.25);
  --dark:#080808;--surface:#111;--surface2:#1A1A1A;--surface3:#222;
  --border:rgba(255,255,255,0.07);--text:#F0EDE8;--text2:#8C877E;--text3:#4A4641;
  --green:#1D9E75;--green-dk:#157A5A;--r:14px;
  --shadow:0 8px 40px rgba(0,0,0,0.7);--shadow-gold:0 8px 32px rgba(201,168,76,0.18);
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

/* HERO */
.hero{position:relative;height:100svh;min-height:580px;max-height:860px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform:scale(1.06);transition:transform 10s ease;}
.hero-img.ready{transform:scale(1);}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,8,1) 0%,rgba(8,8,8,0.55) 42%,rgba(8,8,8,0.1) 100%);z-index:1;}
.hero-no-img{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 35%,#141208 0%,#080808 60%);z-index:0;}
.hero-top{position:absolute;top:0;left:0;right:0;z-index:3;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;}
.hero-logo-mark{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;letter-spacing:0.1em;color:rgba(255,255,255,0.55);}
.hero-badge{background:var(--gold);color:#000;font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;padding:5px 14px;border-radius:20px;}
.gallery-dots{position:absolute;bottom:108px;left:0;right:0;z-index:3;display:flex;justify-content:center;gap:5px;}
.gallery-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.28);cursor:pointer;transition:all 0.25s ease;}
.gallery-dot.on{background:var(--gold);width:18px;border-radius:3px;}
.hero-content{position:relative;z-index:2;padding:0 24px 48px;}
.hero-eyebrow{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.hero-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);display:block;}
.hero-street{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,7.5vw,56px);font-weight:300;line-height:1.08;color:#fff;margin-bottom:6px;letter-spacing:-0.02em;}
.hero-city{font-size:15px;color:rgba(255,255,255,0.38);margin-bottom:28px;letter-spacing:0.03em;}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;}
.hero-pill{background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:100px;padding:9px 18px;display:flex;flex-direction:column;align-items:center;}
.hero-pill-val{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);line-height:1;}
.hero-pill-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:3px;}
.hero-scroll-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;color:rgba(255,255,255,0.2);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{opacity:0.3;transform:translateX(-50%) translateY(0);}50%{opacity:0.7;transform:translateX(-50%) translateY(5px);}}

/* PAGE */
.page{max-width:520px;margin:0 auto;}
.s{padding:36px 22px;}
.s-sm{padding:24px 22px;}
.divider{height:1px;background:linear-gradient(90deg,transparent 0%,var(--border) 30%,var(--border) 70%,transparent 100%);margin:0 22px;}

/* EYEBROW */
.eyebrow{font-size:9px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.eyebrow::before{content:'';width:14px;height:1px;background:var(--gold);}
.s-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;line-height:1.2;margin-bottom:6px;}
.s-sub{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:22px;}

/* DESCRIPTION */
.desc{font-size:14px;color:var(--text2);line-height:1.9;}

/* DETAILS */
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.det-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;text-align:center;cursor:default;transition:transform 0.22s ease,box-shadow 0.22s ease,border-color 0.22s ease;}
.det-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:rgba(255,255,255,0.14);}
.det-icon{font-size:22px;margin-bottom:10px;display:block;}
.det-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);display:block;margin-bottom:2px;}
.det-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);}

/* CALC */
.calc{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.calc-hero{background:linear-gradient(145deg,#071510 0%,#050E09 100%);border-bottom:1px solid rgba(29,158,117,0.15);padding:32px 24px;text-align:center;}
.calc-num{font-family:'Cormorant Garamond',serif;font-size:60px;font-weight:300;color:#fff;line-height:1;}
.calc-num span{font-size:26px;color:rgba(255,255,255,0.3);}
.calc-subtitle{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:8px;}
.calc-body{padding:24px;}
.sl-wrap{margin-bottom:22px;}
.sl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.sl-name{font-size:12px;color:var(--text3);letter-spacing:0.04em;}
.sl-val{font-size:13px;font-weight:600;color:var(--text);}
input[type=range]{width:100%;-webkit-appearance:none;height:2px;border-radius:1px;background:var(--surface3);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--green);cursor:pointer;box-shadow:0 2px 10px rgba(29,158,117,0.5);}
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--surface3);border-radius:10px;overflow:hidden;margin-top:20px;}
.bd-item{background:var(--surface);padding:14px;text-align:center;}
.bd-val{font-size:15px;font-weight:600;margin-bottom:2px;}
.bd-label{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);}
.lender-strip{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--gold-lt);border-top:1px solid var(--gold-md);}
.lender-icon{font-size:26px;flex-shrink:0;}
.lender-text{flex:1;font-size:12px;color:var(--text2);line-height:1.5;}
.lender-name{font-weight:600;color:var(--gold);font-size:13px;display:block;}
.lender-cta{background:var(--gold);color:#000;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;display:inline-block;white-space:nowrap;}

/* FORMS */
.form-box{border-radius:20px;padding:28px;}
.form-box-green{background:linear-gradient(145deg,#071510 0%,#050808 100%);border:1px solid rgba(29,158,117,0.2);}
.form-box-gold{background:linear-gradient(145deg,#14100A 0%,#050808 100%);border:1px solid var(--gold-md);}
.form-icon{font-size:38px;margin-bottom:14px;display:block;text-align:center;}
.inp{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:13px 16px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;margin-bottom:10px;outline:none;transition:border-color 0.2s,background 0.2s;}
.inp:focus{border-color:var(--green);background:rgba(255,255,255,0.06);}
.inp::placeholder{color:var(--text3);}
.inp-gold:focus{border-color:var(--gold);}
.btn-grn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:0.02em;transition:background 0.2s,transform 0.12s;margin-bottom:8px;}
.btn-grn:hover{background:var(--green-dk);}
.btn-grn:active{transform:scale(0.99);}
.btn-grn:disabled{opacity:0.45;cursor:default;}
.btn-gold{width:100%;background:linear-gradient(135deg,var(--gold),#A07830);color:#000;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:0.02em;transition:opacity 0.2s,transform 0.12s;margin-bottom:8px;}
.btn-gold:hover{opacity:0.9;}
.btn-gold:active{transform:scale(0.99);}
.btn-gold:disabled{opacity:0.4;cursor:default;}
.form-hint{font-size:11px;color:var(--text3);text-align:center;letter-spacing:0.03em;}
.success{text-align:center;padding:12px 0;}
.success-em{font-size:46px;margin-bottom:14px;display:block;}
.success-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;margin-bottom:8px;}
.success-sub{font-size:13px;color:var(--text2);line-height:1.8;}

/* NEIGHBORHOOD */
.nbhd-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:8px;text-decoration:none;color:var(--text);transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;}
.nbhd-item:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(255,255,255,0.13);}
.nbhd-item:last-child{margin-bottom:0;}
.nbhd-l{display:flex;align-items:center;gap:14px;}
.nbhd-em{width:44px;height:44px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.nbhd-title{font-size:14px;font-weight:500;margin-bottom:1px;}
.nbhd-sub{font-size:12px;color:var(--text3);}
.nbhd-arr{color:var(--gold);font-size:18px;opacity:0.6;}

/* AGENT */
.agent-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.agent-top{padding:30px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;border-bottom:1px solid var(--border);}
.agent-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(201,168,76,0.1);}
.agent-init{width:90px;height:90px;border-radius:50%;background:linear-gradient(145deg,var(--gold),#8A6020);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:#000;box-shadow:0 0 0 5px rgba(201,168,76,0.1);}
.agent-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;letter-spacing:0.02em;}
.agent-role{font-size:12px;color:var(--text2);}
.agent-brok{font-size:10px;color:var(--gold);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;}
.agent-btns{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;}
.a-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;border:none;font-family:'DM Sans',sans-serif;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s,opacity 0.15s;}
.a-btn:hover{transform:translateY(-2px);}
.a-btn-call{background:var(--gold);color:#000;font-weight:700;}
.a-btn-call:hover{box-shadow:var(--shadow-gold);}
.a-btn-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.a-btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border);}

/* NT PROMO */
.nt-box{background:linear-gradient(145deg,#050C18 0%,#050508 100%);border:1px solid rgba(40,100,200,0.15);border-radius:20px;padding:28px;}
.nt-logo{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;letter-spacing:0.05em;margin-bottom:4px;}
.nt-tag{font-size:10px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:22px;}
.nt-feats{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.nt-feat{display:flex;align-items:flex-start;gap:12px;}
.nt-check{width:20px;height:20px;border-radius:50%;background:rgba(29,158,117,0.12);border:1px solid rgba(29,158,117,0.25);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--green);flex-shrink:0;margin-top:1px;}
.nt-feat-text{font-size:13px;color:var(--text2);line-height:1.5;}
.nt-feat-b{color:var(--text);font-weight:500;}
.nt-cta{display:block;background:linear-gradient(135deg,var(--green),var(--green-dk));color:#fff;border-radius:10px;padding:15px;font-size:15px;font-weight:600;text-decoration:none;text-align:center;letter-spacing:0.02em;transition:transform 0.15s,box-shadow 0.15s;}
.nt-cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(29,158,117,0.32);}

/* FOOTER */
.footer{padding:32px 22px;text-align:center;border-top:1px solid var(--border);}
.footer-t{font-size:11px;color:var(--text3);letter-spacing:0.07em;}

/* AI CARDS */
.ai-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:10px;transition:border-color 0.2s,box-shadow 0.2s;}
.ai-card:hover{border-color:rgba(255,255,255,0.12);box-shadow:var(--shadow);}
.ai-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ai-card-left{display:flex;align-items:center;gap:12px;}
.ai-card-icon{width:42px;height:42px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ai-card-title{font-size:14px;font-weight:500;margin-bottom:2px;}
.ai-card-sub{font-size:12px;color:var(--text3);}
.ai-card-input-row{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
.ai-inp{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;}
.ai-inp:focus{border-color:var(--green);}
.ai-inp::placeholder{color:var(--text3);}
.ai-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:background 0.2s,opacity 0.2s;}
.ai-btn:hover{background:var(--green-dk);}
.ai-btn:disabled{opacity:0.5;cursor:default;}
.ai-result{font-size:13px;color:var(--text2);line-height:1.8;margin-top:12px;display:none;}
.ai-result.show{display:block;}
.ai-result.loading{display:flex;align-items:center;gap:10px;color:var(--text3);}
.ai-spin{width:16px;height:16px;border:1.5px solid rgba(29,158,117,0.2);border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}

/* SAVE HOME BANNER */
.save-banner{background:linear-gradient(135deg,#071510 0%,#050808 100%);border:1px solid rgba(29,158,117,0.25);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s;}
.save-banner:hover{border-color:rgba(29,158,117,0.5);box-shadow:0 4px 20px rgba(29,158,117,0.15);}
.save-banner-icon{font-size:28px;flex-shrink:0;}
.save-banner-text{flex:1;}
.save-banner-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.save-banner-sub{font-size:11px;color:var(--text3);line-height:1.5;}
.save-banner-arrow{color:var(--green);font-size:20px;flex-shrink:0;}

/* SAVE HOME MODAL */
.save-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;display:none;align-items:flex-end;justify-content:center;}
.save-modal.open{display:flex;}
.save-modal-box{background:#111;border-top:1px solid rgba(29,158,117,0.25);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:28px;}

/* SLIDER NUMBER INPUT */
.sl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sl-num{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600;color:var(--text);font-family:'DM Sans',sans-serif;width:80px;text-align:right;outline:none;}


.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.spin{width:34px;height:34px;border:1.5px solid rgba(201,168,76,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin 0.75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.oh-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid rgba(29,158,117,0.4);border-radius:12px;padding:12px 22px;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:var(--shadow);animation:tin 0.2s ease;}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>
<div id="app">
  <div class="loading">
    <div class="spin"></div>
    <div style="font-size:10px;color:var(--text3);letter-spacing:0.15em;text-transform:uppercase;">Loading Property</div>
  </div>
</div>

<!-- SAVE HOME MODAL -->
<div class="save-modal" id="save-modal" onclick="if(event.target===this)this.classList.remove('open')">

    </div>
  </div>
</div>

async function load(id) {
  try {
    const s = await getDoc(doc(db,'offer_listings',id));
    if (!s.exists()) { err('This listing is no longer available.'); return; }
    render({id:s.id,...s.data()});
  } catch(e) { err('Could not load. Please try again.'); }
}

function err(msg) {
  document.getElementById('app').innerHTML = `<div class="loading page" style="padding:40px;text-align:center;">
    <div style="font-size:52px;opacity:0.15;margin-bottom:20px;">🏠</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;margin-bottom:14px;">${msg}</div>
    <a href="https://app.garucciogroup.com" style="color:var(--gold);font-size:13px;text-decoration:none;letter-spacing:0.06em;">Visit Nest Track →</a>
  </div>`;
}

const $f = n => '$'+Math.round(n).toLocaleString();
function calcPI(p,d,r,t){ const pr=p*(1-d/100),mo=r/100/12,n=t*12; return mo===0?pr/n:pr*(mo*Math.pow(1+mo,n))/(Math.pow(1+mo,n)-1); }

function render(l) {
  const ag = AGENTS[l.agentId]||AGENTS.tom;
  const price = parseFloat(String(l.listPrice||'0').replace(/[^0-9.]/g,''))||0;
  const pts = (l.address||'').split(',');
  const street = pts[0]||l.address||'Property';
  const city   = pts.slice(1).join(',').trim();
  const ini = ag.name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  const enc = encodeURIComponent(l.address||'');
  const photos = l.photos||(l.photoUrl?[l.photoUrl]:[]);

  let dp=10, rp=6.0, tm=30, pi=0;
  // Use actual taxes from listing if available, else estimate
  const annualTax = l.taxes ? parseFloat(l.taxes) : (price * 0.015);
  const tax_ = ()=> annualTax/12;
  const pi_ = ()=> calcPI(price,dp,rp,tm);
  const ins_ = ()=> price*0.005/12;
  const tot_ = ()=> pi_()+tax_()+ins_();

  document.getElementById('app').innerHTML = `<div class="page">

  <!-- HERO -->

    <div class="hero-top">
      <div class="hero-logo-mark">Nest Track</div>
      <div class="hero-badge">Open House</div>
    </div>
    ${photos.length>1?`<div class="gallery-dots">${photos.map((_,i)=>`<div class="gallery-dot${i===0?' on':''}" data-i="${i}"></div>`).join('')}</div>`:''}

      <div class="hero-eyebrow">Property Preview</div>
      <div class="hero-street">${street}</div>
      ${city?`<div class="hero-city">${city}</div>`:''}
      ${(price||l.beds||l.baths||l.sqft)?`<div class="hero-pills">

        ${l.beds?`<div class="hero-pill"><div class="hero-pill-val">${l.beds}</div><div class="hero-pill-label">Beds</div></div>`:''}
        ${l.baths?`<div class="hero-pill"><div class="hero-pill-val">${l.baths}</div><div class="hero-pill-label">Baths</div></div>`:''}
        ${l.sqft?`<div class="hero-pill"><div class="hero-pill-val">${Number(l.sqft).toLocaleString()}</div><div class="hero-pill-label">Sq Ft</div></div>`:''}
      </div>`:''}
    </div>
    <div class="hero-scroll-hint"><span>↓</span><span>Explore</span></div>
  </div>

  <!-- SAVE HOME BANNER -->
  <div class="s" style="padding-bottom:0;">
    <div class="save-banner" onclick="document.getElementById('save-modal').classList.add('open')">
      <div class="save-banner-icon">💾</div>
      <div class="save-banner-text">
        <div class="save-banner-title">Save This Home</div>
        <div class="save-banner-sub">Free Nest Track account · Tour Mode · rate alerts · AI tools</div>
      </div>
      <div class="save-banner-arrow">→</div>
    </div>
  </div>

  ${l.description?`<div class="s"><div class="eyebrow">About This Home</div><div class="desc">${l.description}</div></div><div class="divider"></div>`:''}

  ${(l.beds||l.baths||l.sqft||l.yearBuilt)?`<div class="s">
    <div class="eyebrow">Property Details</div>
    <div class="det-grid">
      ${l.beds?`<div class="det-card"><span class="det-icon">🛏️</span><span class="det-val">${l.beds}</span><span class="det-label">Bedrooms</span></div>`:''}
      ${l.baths?`<div class="det-card"><span class="det-icon">🛁</span><span class="det-val">${l.baths}</span><span class="det-label">Bathrooms</span></div>`:''}
      ${l.sqft?`<div class="det-card"><span class="det-icon">📐</span><span class="det-val">${Number(l.sqft).toLocaleString()}</span><span class="det-label">Sq Footage</span></div>`:''}
      ${l.yearBuilt?`<div class="det-card"><span class="det-icon">🏗️</span><span class="det-val">${l.yearBuilt}</span><span class="det-label">Year Built</span></div>`:''}
    </div>
  </div><div class="divider"></div>`:''}

  ${price>0?`<div class="s">
    <div class="eyebrow">What Will This Cost Me?</div>
    <div class="s-title">Your Monthly Payment</div>
    <div class="s-sub">Adjust the sliders to match your down payment and current rate.</div>
    <div class="calc">
      <div class="calc-hero">
        <div class="calc-num" id="c-tot">${$f(tot_())}<span>/mo</span></div>
        <div class="calc-subtitle">Estimated Total Monthly Payment</div>
      </div>
      <div class="calc-body">
        <div class="sl-wrap">
          <div class="sl-row"><span class="sl-name">Down Payment</span><input type="number" class="sl-num" id="n-dp" min="3" max="30" step="1" value="${dp}" oninput="syncSlider('dp')"/>%</div>
          <input type="range" id="s-dp" min="3" max="30" step="1" value="${dp}" oninput="cu();document.getElementById('n-dp').value=this.value"/>
          <div style="font-size:11px;color:var(--text3);margin-top:4px;" id="l-dp">${$f(price*dp/100)} down</div>
        </div>
        <div class="sl-wrap">
          <div class="sl-row"><span class="sl-name">Interest Rate</span><input type="number" class="sl-num" id="n-rp" min="4" max="10" step="0.125" value="6.0" oninput="syncSlider('rp')"/>%</div>
          <input type="range" id="s-rp" min="4" max="10" step="0.125" value="6.0" oninput="cu();document.getElementById('n-rp').value=parseFloat(this.value).toFixed(3)"/>
        </div>
        <div class="sl-wrap">
          <div class="sl-row"><span class="sl-name">Loan Term</span><input type="number" class="sl-num" id="n-tm" min="10" max="30" step="5" value="${tm}" oninput="syncSlider('tm')"/> yrs</div>
          <input type="range" id="s-tm" min="10" max="30" step="5" value="${tm}" oninput="cu();document.getElementById('n-tm').value=this.value"/>
        </div>
        <div class="bd-grid">
          <div class="bd-item"><div class="bd-val" id="b-pi">${$f(pi_())}</div><div class="bd-label">P&amp;I</div></div>
          <div class="bd-item"><div class="bd-val" id="b-tx">${$f(tax_())}</div><div class="bd-label">Est. Tax</div></div>
          <div class="bd-item"><div class="bd-val" id="b-in">${$f(ins_())}</div><div class="bd-label">Est. Insurance</div></div>
          <div class="bd-item"><div class="bd-val" id="b-ln">${$f(price*(1-dp/100))}</div><div class="bd-label">Loan Amount</div></div>
        </div>
      </div>
      <div class="lender-strip">
        <div class="lender-icon">🏦</div>
        <div class="lender-text"><span class="lender-name">${LENDER.name}</span>${LENDER.title} — reach out about financing.</div>
        <a href="tel:${LENDER.phone}" class="lender-cta">Call</a>
      </div>
    </div>
    <div style="font-size:10px;color:var(--text3);text-align:center;margin-top:10px;letter-spacing:0.03em;">Estimates only. Consult your lender for exact figures.</div>
  </div><div class="divider"></div>`:''}

    <div class="s-title">Get Your Complete Breakdown</div>

      <span class="form-icon">📊</span>
      <input type="text" class="inp" id="r-nm" placeholder="Your name"/>
      <input type="email" class="inp" id="r-em" placeholder="Email address"/>
      <input type="tel" class="inp" id="r-ph" placeholder="Phone (optional)"/>
      <button class="btn-grn" id="r-btn" onclick="doReport('${l.id}','${l.agentId}','${(l.address||'').replace(/'/g,'')}')">Get My Property Report →</button>
      <div class="form-hint">No spam · Unsubscribe anytime</div>
    </div>
  </div>
  <div class="divider"></div>

  ${l.giveawayEnabled?`<div class="s">
    <div class="eyebrow">Open House Drawing</div>
    <div class="form-box form-box-gold" id="gw-wrap">
      <span class="form-icon">🎁</span>
      <div class="s-title" style="text-align:center;margin-bottom:6px;">Win ${l.giveawayPrize||'$100 Amazon Gift Card'}</div>
      <div style="font-size:13px;color:var(--text2);text-align:center;line-height:1.7;margin-bottom:20px;">Enter for a chance to win. One drawing held after each open house.</div>
      <input type="text" class="inp inp-gold" id="g-nm" placeholder="Your name"/>
      <input type="email" class="inp inp-gold" id="g-em" placeholder="Email address"/>
      <button class="btn-gold" id="g-btn" onclick="doGiveaway('${l.id}','${l.agentId}')">Enter Drawing →</button>
      <div class="form-hint">Winner contacted by email. No purchase necessary.</div>
    </div>
  </div><div class="divider"></div>`:''}

  <div id="doc-section-wrap"></div>

  <!-- AI NEIGHBORHOOD TOOLS -->
  <div class="s">
    <div class="eyebrow">Neighborhood Intelligence</div>
    <div class="s-title">Explore the Area</div>
    <div class="s-sub" style="margin-bottom:20px;">AI-powered insights — tap any card to generate.</div>

    <!-- Schools -->
    <div class="ai-card" id="ai-schools">
      <div class="ai-card-header">
        <div class="ai-card-left">
          <div class="ai-card-icon">🏫</div>
          <div>
            <div class="ai-card-title">School District</div>
            <div class="ai-card-sub">Ratings, schools &amp; district overview</div>
          </div>
        </div>
      </div>
      <div class="ai-card-input-row">
        <input type="text" class="ai-inp" id="school-city" value="${city||street}" placeholder="City or area"/>
        <button class="ai-btn" onclick="aiGenerate('schools','${l.id}')">Generate →</button>
      </div>
      <div class="ai-result" id="ai-schools-result"></div>
    </div>

    <!-- Neighborhood -->
    <div class="ai-card" id="ai-nbhd">
      <div class="ai-card-header">
        <div class="ai-card-left">
          <div class="ai-card-icon">🏘️</div>
          <div>
            <div class="ai-card-title">Neighborhood Overview</div>
            <div class="ai-card-sub">Character, amenities &amp; lifestyle</div>
          </div>
        </div>
      </div>
      <div class="ai-card-input-row">
        <input type="text" class="ai-inp" id="nbhd-city" value="${city||street}" placeholder="City or area"/>
        <button class="ai-btn" onclick="aiGenerate('neighborhood','${l.id}')">Generate →</button>
      </div>
      <div class="ai-result" id="ai-nbhd-result"></div>
    </div>

    <!-- Commute -->
    <div class="ai-card" id="ai-commute" style="margin-bottom:0;">
      <div class="ai-card-header">
        <div class="ai-card-left">
          <div class="ai-card-icon">🚗</div>
          <div>
            <div class="ai-card-title">Commute Estimator</div>
            <div class="ai-card-sub">Drive time &amp; transit options</div>
          </div>
        </div>
      </div>
      <div class="ai-card-input-row" style="flex-direction:column;gap:8px;">
        <input type="text" class="ai-inp" id="commute-from" value="${l.address||''}" placeholder="From (property address)"/>
        <input type="text" class="ai-inp" id="commute-to" placeholder="To (your workplace or city)"/>
        <button class="ai-btn" style="width:100%;" onclick="aiGenerate('commute','${l.id}')">Estimate My Commute →</button>
      </div>
      <div class="ai-result" id="ai-commute-result"></div>
    </div>
  </div>
  <div class="divider"></div>

  <!-- AGENT -->
  <div class="s">
    <div class="eyebrow">Your Agent</div>
    <div class="agent-box">
      <div class="agent-top">
        ${ag.photo?`<img src="${ag.photo}" class="agent-photo" alt="${ag.name}"/>`:`<div class="agent-init">${ini}</div>`}
        <div>
          <div class="agent-name">${ag.name}</div>
          <div class="agent-role" style="margin:3px 0 5px;">${ag.role}</div>
          <div class="agent-brok">Real Brokerage · The Garuccio Group</div>
        </div>
      </div>
      <div class="agent-btns">
        <a href="tel:${ag.phone}" class="a-btn a-btn-call">📞 Call ${ag.name.split(' ')[0]}</a>
        <div class="a-btn-2">
          <a href="sms:${ag.phone}" class="a-btn a-btn-sec">💬 Text</a>
          <a href="mailto:${ag.email}" class="a-btn a-btn-sec">✉️ Email</a>
        </div>
      </div>
    </div>
  </div>
  <div class="divider"></div>

  <!-- NEST TRACK PROMO -->
  <div class="s">
    <div class="eyebrow">Free for Home Buyers</div>
    <div class="nt-box">
      <div class="nt-logo">Nest Track</div>
      <div class="nt-tag">Built for serious home buyers</div>
      <div class="nt-feats">
        <div class="nt-feat"><div class="nt-check">✓</div><div class="nt-feat-text"><span class="nt-feat-b">Tour Mode</span> — take notes, photos &amp; ratings at every showing</div></div>
        <div class="nt-feat"><div class="nt-check">✓</div><div class="nt-feat-text"><span class="nt-feat-b">Save &amp; compare homes</span> side by side with your agent</div></div>
        <div class="nt-feat"><div class="nt-check">✓</div><div class="nt-feat-text"><span class="nt-feat-b">Rate tracker</span> — get alerted the moment mortgage rates drop</div></div>
        <div class="nt-feat"><div class="nt-check">✓</div><div class="nt-feat-text"><span class="nt-feat-b">School, commute &amp; neighborhood</span> tools all in one place</div></div>
        <div class="nt-feat"><div class="nt-check">✓</div><div class="nt-feat-text"><span class="nt-feat-b">Direct line to your agent</span> — message, call, or schedule anytime</div></div>
      </div>
      <a href="https://app.garucciogroup.com" class="nt-cta">Get Free Access →</a>
    </div>
  </div>

  <div class="footer"><div class="footer-t">Powered by <span style="color:var(--gold);">Nest Track</span> &nbsp;·&nbsp; ${ag.name} &nbsp;·&nbsp; Real Brokerage</div></div>
  </div>`;

  // Render document request section if docs exist
  const docWrap = document.getElementById('doc-section-wrap');
  if (docWrap && l.documents && l.documents.length) {
    const docList = l.documents.map(d=>'<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:6px;"><span style="color:var(--gold)">📄</span>'+d.name+'</div>').join('');
    docWrap.innerHTML = '<div class="s"><div class="eyebrow">Property Documents</div><div class="s-title">Request Disclosure Docs</div><div class="s-sub" style="margin-bottom:16px;">Full disclosure package, inspection reports, and HOA documents — sent directly to your inbox.</div><div class="form-box form-box-green" id="doc-wrap"><span class="form-icon">📄</span><div style="margin-bottom:14px;">'+docList+'</div><input type="text" class="inp" id="doc-nm" placeholder="Your name"/><input type="email" class="inp" id="doc-em" placeholder="Email address"/><input type="tel" class="inp" id="doc-ph" placeholder="Phone (optional)"/><button class="btn-grn" id="doc-btn" onclick="doRequestDocs()">Send Me These Documents →</button><div class="form-hint">Sent instantly · No spam</div></div></div><div class="divider"></div>';
  }

  // Ken Burns on hero image
  const himg = document.getElementById('himg');
  if (himg) { himg.onload=()=>himg.classList.add('ready'); if(himg.complete) himg.classList.add('ready'); }

  // Photo gallery dots + touch swipe
  let touchStartX = 0;
  const heroEl = document.querySelector('.hero');
  if (heroEl) {
    heroEl.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
    heroEl.addEventListener('touchend', e=>{
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        let idx = parseInt(document.querySelector('.gallery-dot.on')?.getAttribute('data-i')||'0');
        idx = diff > 0 ? Math.min(idx+1, photos.length-1) : Math.max(idx-1, 0);
        if(himg) himg.src=photos[idx];
        document.querySelectorAll('.gallery-dot').forEach((x,j)=>x.classList.toggle('on',j===idx));
      }
    }, {passive:true});
  }
  document.querySelectorAll('.gallery-dot').forEach(d=>{
    d.addEventListener('click',()=>{
      const i=parseInt(d.getAttribute('data-i'));
      if(himg) himg.src=photos[i];
      document.querySelectorAll('.gallery-dot').forEach((x,j)=>x.classList.toggle('on',j===i));
    });
  });

  // Mortgage calc with number input sync
  window.syncSlider = (field) => {
    const num = document.getElementById('n-'+field);
    const sl = document.getElementById('s-'+field);
    if (num && sl) { sl.value = num.value; cu(); }
  };

  window.cu = () => {
    dp=parseFloat(document.getElementById('s-dp').value)||10;
    rp=parseFloat(document.getElementById('s-rp').value)||6.875;
    tm=parseInt(document.getElementById('s-tm').value)||30;
    const dpEl=document.getElementById('l-dp');
    if(dpEl) dpEl.textContent=$f(price*dp/100)+' down';
    document.getElementById('c-tot').innerHTML=$f(tot_())+'<span>/mo</span>';
    document.getElementById('b-pi').textContent=$f(pi_());
    document.getElementById('b-tx').textContent=$f(tax_());
    document.getElementById('b-in').textContent=$f(ins_());
    document.getElementById('b-ln').textContent=$f(price*(1-dp/100));
  };

  // Report
  window.doReport = async (lid,agId,addr) => {
    const nm=document.getElementById('r-nm').value.trim();
    const em=document.getElementById('r-em').value.trim();
    const ph=document.getElementById('r-ph')?document.getElementById('r-ph').value.trim():'';
    if(!nm||!em){toast('Please enter your name and email.');return;}
    const btn=document.getElementById('r-btn');
    btn.disabled=true;btn.textContent='Sending...';
    try {
      await addDoc(collection(db,'open_house_leads'),{
        listingId:lid,agentId:agId,address:addr,name:nm,email:em,phone:ph||'',
        downPct:dp,ratePct:rp,term:tm,monthlyPayment:Math.round(tot_()),
        createdAt:serverTimestamp(),source:'property_report'
      });
      // Auto-create Pipeline contact
      const nameParts=nm.trim().split(' ');
      await addDoc(collection(db,'users'),{
        firstName:nameParts[0]||nm, lastName:nameParts.slice(1).join(' ')||'',
        email:em, phone:ph||'', agentId:agId,
        role:'buyer', journeyType:'buyer', crmStatus:'Pipeline',
        source:'open_house', sourceAddress:addr||'',
        currentStep:1, isContact:true, portalAccess:false,
        createdAt:serverTimestamp()
      });
      var firstName=nm.split(' ')[0];
      var payBlock = price>0
        ? '<div style="background:#f8f9fa;border-radius:10px;padding:20px;margin-bottom:24px;">'
          + '<div style="font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#888;margin-bottom:12px;">Your Monthly Payment Estimate</div>'
          + '<div style="font-size:42px;font-weight:300;color:#1D9E75;margin-bottom:4px;">'+$f(tot_())+'<span style="font-size:18px;color:#aaa">/mo</span></div>'
          + '<div style="font-size:12px;color:#888;margin-bottom:16px;">Based on '+dp+'% down · '+rp+'% rate · '+tm+'-year term</div>'
          + '<table style="width:100%;border-collapse:collapse;font-size:13px;">'
          + '<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee;">Principal & Interest</td><td style="text-align:right;font-weight:600;border-bottom:1px solid #eee;">'+$f(pi_())+'</td></tr>'
          + '<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee;">Est. Property Tax</td><td style="text-align:right;font-weight:600;border-bottom:1px solid #eee;">'+$f(tax_())+'</td></tr>'
          + '<tr><td style="padding:6px 0;color:#555;">Est. Insurance</td><td style="text-align:right;font-weight:600;">'+$f(ins_())+'</td></tr>'
          + '</table></div>' : '';
      var detBlock = (l.beds||l.baths||l.sqft||l.yearBuilt)
        ? '<div style="background:#f8f9fa;border-radius:10px;padding:20px;margin-bottom:24px;">'
          + '<div style="font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#888;margin-bottom:12px;">Property Details</div>'
          + '<div style="display:flex;gap:20px;flex-wrap:wrap;">'
          + (l.beds?'<div><div style="font-size:20px;font-weight:600;">'+l.beds+'</div><div style="font-size:11px;color:#888;">Beds</div></div>':'')
          + (l.baths?'<div><div style="font-size:20px;font-weight:600;">'+l.baths+'</div><div style="font-size:11px;color:#888;">Baths</div></div>':'')
          + (l.sqft?'<div><div style="font-size:20px;font-weight:600;">'+Number(l.sqft).toLocaleString()+'</div><div style="font-size:11px;color:#888;">Sq Ft</div></div>':'')
          + (l.yearBuilt?'<div><div style="font-size:20px;font-weight:600;">'+l.yearBuilt+'</div><div style="font-size:11px;color:#888;">Built</div></div>':'')
          + '</div></div>' : '';
      var emailHtml = '<div style="font-family:Georgia,serif;max-width:560px;margin:0 auto;color:#1a1a1a;">'
        + '<div style="background:#0D0D0D;padding:24px 28px;border-radius:10px 10px 0 0;">'
        + '<div style="font-size:24px;font-weight:300;color:#fff;">Your Property Report</div>'
        + '<div style="font-size:13px;color:rgba(255,255,255,0.45);margin-top:4px;">'+(addr||'')+'</div></div>'
        + '<div style="background:#fff;padding:28px;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 10px 10px;">'
        + '<p style="font-size:16px;margin-bottom:20px;">Hi '+firstName+',</p>'
        + '<p style="font-size:14px;color:#444;line-height:1.8;margin-bottom:24px;">Thanks for visiting. Here is your full breakdown for <strong>'+(addr||'')+'</strong>.</p>'
        + payBlock + detBlock
        + '<div style="background:#f8f9fa;border-radius:10px;padding:20px;margin-bottom:24px;">'
        + '<div style="font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:#888;margin-bottom:12px;">Your Agent</div>'
        + '<div style="font-size:16px;font-weight:600;margin-bottom:2px;">'+ag.name+'</div>'
        + '<div style="font-size:13px;color:#666;margin-bottom:12px;">'+ag.role+' · Real Brokerage</div>'
        + '<a href="tel:'+ag.phone+'" style="display:inline-block;background:#1D9E75;color:#fff;border-radius:8px;padding:10px 20px;font-size:14px;text-decoration:none;font-weight:600;margin-right:8px;">Call</a>'
        + '<a href="sms:'+ag.phone+'" style="display:inline-block;background:#f0f0f0;color:#333;border-radius:8px;padding:10px 20px;font-size:14px;text-decoration:none;font-weight:600;">Text</a></div>'
        + '<div style="text-align:center;padding:20px;background:#0D0D0D;border-radius:10px;">'
        + '<div style="font-size:18px;color:#fff;font-weight:300;margin-bottom:8px;">Nest Track</div>'
        + '<div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px;">Tour Mode · Rate Tracker · Saved Homes · AI Tools</div>'
        + '<a href="https://app.garucciogroup.com" style="display:inline-block;background:#1D9E75;color:#fff;border-radius:8px;padding:10px 24px;font-size:14px;text-decoration:none;font-weight:600;">Get Free Access</a></div>'
        + '<p style="font-size:11px;color:#aaa;text-align:center;margin-top:20px;">Estimate only. Consult your lender for exact figures.</p>'
        + '</div></div>';
      await fetch('https://app.tom-b52.workers.dev',{method:'POST',headers:{'Content-Type':'application/json','X-Action':'email'},
        body:JSON.stringify({to:em,subject:'Your Property Report — '+addr,html:emailHtml,from:'Nest Track <notifications@mail.garucciogroup.com>',reply_to:ag.email})});
      document.getElementById('rpt-wrap').innerHTML='<div class="success"><span class="success-em">📬</span><div class="success-title">Report sent!</div><div class="success-sub">Check <strong>'+em+'</strong> — your personalized payment breakdown is on the way.</div></div>';
    } catch(e){btn.disabled=false;btn.textContent='Get My Property Report →';toast('Something went wrong.');}
  };


  // Giveaway
  window.doGiveaway = async (lid,agId) => {
    const nm=document.getElementById('g-nm').value.trim();
    const em=document.getElementById('g-em').value.trim();
    if(!nm||!em){toast('Please enter your name and email.');return;}
    const btn=document.getElementById('g-btn');
    btn.disabled=true;btn.textContent='Entering...';
    try {
      await addDoc(collection(db,'open_house_leads'),{
        listingId:lid,agentId:agId,name:nm,email:em,
        createdAt:serverTimestamp(),source:'giveaway'
      });
      document.getElementById('gw-wrap').innerHTML=`<div class="success">
        <span class="success-em">🎉</span>
        <div class="success-title">You're entered!</div>
        <div class="success-sub">Good luck, ${nm.split(' ')[0]}! The winner will be notified by email after the open house.</div>
      </div>`;
    } catch(e){btn.disabled=false;btn.textContent='Enter Drawing →';toast('Something went wrong.');}
  };

  // Request Documents
  window.doRequestDocs = async () => {
    const nm=document.getElementById('doc-nm').value.trim();
    const em=document.getElementById('doc-em').value.trim();
    const ph=document.getElementById('doc-ph')?document.getElementById('doc-ph').value.trim():'';
    if(!nm||!em){toast('Please enter your name and email.');return;}
    const btn=document.getElementById('doc-btn');
    btn.disabled=true;btn.textContent='Sending...';
    try {
      await addDoc(collection(db,'open_house_leads'),{
        listingId:l.id,agentId:l.agentId,address:l.address,
        name:nm,email:em,phone:ph||'',createdAt:serverTimestamp(),source:'document_request'
      });
      const docParts=nm.trim().split(' ');
      await addDoc(collection(db,'users'),{
        firstName:docParts[0]||nm, lastName:docParts.slice(1).join(' ')||'',
        email:em, phone:ph||'', agentId:l.agentId,
        role:'buyer', journeyType:'buyer', crmStatus:'Pipeline',
        source:'open_house', sourceAddress:l.address||'',
        currentStep:1, isContact:true, portalAccess:false,
        createdAt:serverTimestamp()
      });
      const docLinks=(l.documents||[]).map(d=>'<div style="margin-bottom:10px;"><a href="'+d.url+'" style="color:#1D9E75;text-decoration:none;font-size:14px;">📄 '+d.name+'</a></div>').join('');
      const emailHtml='<div style="font-family:Georgia,serif;max-width:540px;margin:0 auto;"><div style="background:#0D0D0D;padding:22px 26px;border-radius:10px 10px 0 0;"><div style="font-size:22px;font-weight:300;color:#fff;">Property Documents</div><div style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:2px;">'+(l.address||'')+'</div></div><div style="background:#fff;padding:28px;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 10px 10px;"><p style="font-size:15px;margin-bottom:16px;">Hi '+nm.split(' ')[0]+',</p><p style="font-size:14px;color:#444;line-height:1.7;margin-bottom:20px;">Here are the documents you requested for <strong>'+(l.address||'the property')+'</strong>:</p>'+docLinks+'<p style="font-size:13px;color:#666;margin-top:24px;">Questions? '+ag.name+' is here to help.<br/><a href="tel:'+ag.phone+'" style="color:#1D9E75;">'+ag.phone+'</a></p></div></div>';
      await fetch('https://app.tom-b52.workers.dev',{method:'POST',headers:{'Content-Type':'application/json','X-Action':'email'},body:JSON.stringify({to:em,subject:'Your Property Documents — '+(l.address||''),html:emailHtml,from:'Nest Track <notifications@mail.garucciogroup.com>',reply_to:ag.email})});
      document.getElementById('doc-wrap').innerHTML='<div class="success"><span class="success-em">📬</span><div class="success-title">Documents sent!</div><div class="success-sub">Check <strong>'+em+'</strong> — all documents are on their way.</div></div>';
    } catch(e){btn.disabled=false;btn.textContent='Send Me These Documents →';toast('Something went wrong.');}
  };

  // AI Tools
  window.aiGenerate = async (type) => {
    const resultIds = {schools:'ai-schools-result', neighborhood:'ai-nbhd-result', commute:'ai-commute-result'};
    const resultEl = document.getElementById(resultIds[type]);
    if (!resultEl) return;
    const btn = event.target;
    btn.disabled=true;
    resultEl.className='ai-result loading show';
    resultEl.innerHTML='<div class="ai-spin"></div><span>Generating...</span>';

    let prompt='';
    if (type==='schools') {
      const v=document.getElementById('school-city').value.trim();
      prompt=`Provide a concise, friendly overview of schools in ${v} for a home buyer. Include the school district name, notable elementary/middle/high schools, general academic reputation, and any standout programs. 4-6 sentences. No disclaimers.`;
    } else if (type==='neighborhood') {
      const v=document.getElementById('nbhd-city').value.trim();
      prompt=`Describe the neighborhood character of ${v} for a home buyer. Cover the overall vibe, types of residents, walkability, nearby amenities, dining and shopping, parks, and what makes it unique. 4-6 engaging sentences. No disclaimers.`;
    } else if (type==='commute') {
      const from=document.getElementById('commute-from').value.trim();
      const to=document.getElementById('commute-to').value.trim();
      if (!to) { resultEl.className='ai-result show'; resultEl.innerHTML='<span style="color:var(--text3);">Please enter your workplace or destination.</span>'; btn.disabled=false; return; }
      prompt=`Estimate the commute from ${from} to ${to}. Include approximate drive time in normal traffic, drive time in rush hour, whether public transit is an option and how long, and overall assessment of the commute. 3-5 sentences. Be realistic and helpful. No disclaimers.`;
    }

    try {
      const res = await fetch('https://app.tom-b52.workers.dev',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-5-20250929',max_tokens:400,messages:[{role:'user',content:prompt}]})
      });
      const data = await res.json();
      const text = (data.content&&data.content[0]&&data.content[0].text)?data.content[0].text:((data.error&&data.error.message)||'Could not generate. Please try again.');
      resultEl.className='ai-result show';
      resultEl.innerHTML='<div style="border-left:2px solid var(--green);padding-left:12px;margin-top:4px;">'+text.replace(/\n/g,'<br/>')+'</div>';
    } catch(e) {
      resultEl.className='ai-result show';
      resultEl.innerHTML='<span style="color:var(--text3);">Could not generate: '+e.message+'</span>';
    }
    btn.disabled=false;
  };

  // Save Home
  window.doSaveHome = async () => {
    const nm=document.getElementById('sv-nm').value.trim();
    const em=document.getElementById('sv-em').value.trim();
    const ph=document.getElementById('sv-ph').value.trim();
    if(!nm||!em){toast('Please enter your name and email.');return;}
    const btn=document.getElementById('sv-btn');
    btn.disabled=true;btn.textContent='Saving...';
    try {
      await addDoc(collection(db,'open_house_leads'),{
        listingId:l.id,agentId:l.agentId,address:l.address,
        name:nm,email:em,phone:ph,
        createdAt:serverTimestamp(),source:'save_home'
      });
      // Auto-create Pipeline contact
      const svParts=nm.trim().split(' ');
      await addDoc(collection(db,'users'),{
        firstName:svParts[0]||nm, lastName:svParts.slice(1).join(' ')||'',
        email:em, phone:ph||'', agentId:l.agentId,
        role:'buyer', journeyType:'buyer', crmStatus:'Pipeline',
        source:'open_house', sourceAddress:l.address||'',
        currentStep:1, isContact:true, portalAccess:false,
        createdAt:serverTimestamp()
      });
      document.getElementById('save-form-wrap').innerHTML=`
        <div style="text-align:center;padding:12px 0;">
          <div style="font-size:42px;margin-bottom:14px;">🏠</div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;margin-bottom:8px;">Home Saved!</div>
          <div style="font-size:13px;color:var(--text2);line-height:1.7;">Your agent will be in touch. Get your free Nest Track account to access Tour Mode, rate alerts, saved homes, and more.</div>
          <a href="https://app.garucciogroup.com" style="display:inline-block;margin-top:16px;background:var(--green);color:#fff;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;text-decoration:none;">Get Free Access →</a>
        </div>`;
    } catch(e){btn.disabled=false;btn.textContent='Save This Home →';toast('Something went wrong.');}
  };
}

function toast(m){
  const t=document.createElement('div');
  t.className='oh-toast';t.textContent=m;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
</script>
</body>
</html>
